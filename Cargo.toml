[package]
name = "elyk-dev"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3.102"
leptos = { version = "0.8.19", features = ["csr"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
send_wrapper = "0.6.0"
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.102", features = ["CanvasRenderingContext2d", "Document", "DomRect", "Element", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "MouseEvent", "Storage", "Touch", "TouchEvent", "TouchList", "Window"] }
