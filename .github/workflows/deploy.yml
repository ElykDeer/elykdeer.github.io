name: Deploy to GitHub Pages

# Builds the Trunk/WASM site and publishes dist/ to GitHub Pages.
# In repo Settings → Pages, set Source to "GitHub Actions".

on:
  push:
    branches: [master, main, original]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        if: ${{ env.ACT != 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal \
            --component clippy \
            --component rustfmt \
            --target wasm32-unknown-unknown
          rustup default stable

      - name: Install Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C "$HOME/.cargo/bin"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test

      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Verify word assets
        run: python3 scripts/check_word_assets.py

      - name: Build
        run: trunk build --release

      - name: Verify release artifact
        run: |
          python3 scripts/check_word_assets.py --dist dist
          if LC_ALL=C grep -R -a -i -E 'snek|cheat' dist --include='*.js' --include='*.wasm'; then
            echo "debug-only Snek or cheat code leaked into the release artifact" >&2
            exit 1
          fi

      - name: Preserve custom domain
        run: cp CNAME dist/

      - name: Upload Pages artifact
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
